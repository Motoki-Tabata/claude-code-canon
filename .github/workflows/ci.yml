name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # windows-latest の既定シェルは pwsh。以下のステップは POSIX sh の記法で書くので、
        # Windows ランナー同梱の git-bash を明示的に使う。
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 依存ゼロ設計（package.json の comments.deps 参照）: npm install/ci は不要。

      - name: npm test
        run: npm test
